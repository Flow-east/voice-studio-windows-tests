name: Windows busy file regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  busy-file-regression:
    name: File lock recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load hash-pinned published baseline
        shell: pwsh
        run: python load_busy_baseline.py
      - name: Verify native file lock recovery and regressions
        shell: pwsh
        run: node ci_busy_tests.mjs
