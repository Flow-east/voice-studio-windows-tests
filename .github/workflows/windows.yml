name: Windows model file publication

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-windows:
    name: Native file operations (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Compare released and candidate downloaders on native NTFS
        shell: pwsh
        run: python native_probe.py --baseline baseline --candidate candidate --output results.json
      - name: Show bounded fixture results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path results.json) { Get-Content results.json }
