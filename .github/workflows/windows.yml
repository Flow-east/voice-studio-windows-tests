name: Windows process stop regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-stop:
    name: Native process stop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Profile explicit system module loading
        shell: pwsh
        run: node profile_startup.mjs --package-dir candidate-package --output profile.json
      - name: Show bounded profile results
        if: always()
        shell: pwsh
        run: Get-Content profile.json
