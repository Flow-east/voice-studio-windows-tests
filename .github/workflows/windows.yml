name: Windows persistent progress cache regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistent-state-regression:
    name: Persistent progress cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load hash-pinned published baseline
        shell: pwsh
        run: python load_state_baseline.py
      - name: Verify persistent state sharing conflicts and regressions
        shell: pwsh
        run: node ci_state_suite.mjs
