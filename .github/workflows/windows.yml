name: Windows process stop investigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows-stop:
    name: Native process stop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Load hash-pinned public release without install scripts
        shell: pwsh
        run: python load_released_package.py
      - name: Investigate controlled process trees
        shell: pwsh
        run: node native_stop_probe.mjs --package-dir released --output stop-results.json
      - name: Show bounded synthetic results
        if: always()
        shell: pwsh
        run: |
          if (Test-Path stop-results.json) { Get-Content stop-results.json }
