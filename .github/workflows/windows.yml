name: Windows actual model preparation audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-prepare-audit:
    name: Actual preparation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Load immutable published package
        shell: pwsh
        run: python full-download/load_public026.py
      - name: Prepare real tool and interpreter fixtures
        shell: pwsh
        run: python full-download/prepare_tools.py
      - name: Exercise unmodified model preparation with fixture HTTP only
        shell: pwsh
        run: node full-download/suite.mjs --final
