name: Windows downloader ancestor handle reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ancestor-handle-repro:
    name: Downloader ancestor handles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Load hash-pinned published baseline
        shell: pwsh
        run: python load_state_baseline.py
      - name: Compare actual downloader ownership, host progress, and containment
        shell: pwsh
        run: node ancestor-lock/suite.mjs
